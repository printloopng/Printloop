      - key: PL_API_URL
        value: https://printloop-api.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: https://printloop-api.onrender.com
      - key: PL_APEX_DOMAINS
        value: printloop.app
      - key: NEXT_PUBLIC_LANDING_URL
        value: https://printloop-landing.onrender.com
      - key: NEXT_PUBLIC_CUSTOMER_URL
        value: https://printloop-customer.onrender.com
      - key: NEXT_PUBLIC_SHOP_URL

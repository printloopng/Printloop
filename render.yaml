databases:
  - name: printloop-db
    plan: free
    databaseName: printloop
    user: printloop

envVarGroups:
  - name: printloop-shared
    envVars:
      - key: PL_EDGE_SECRET
        generateValue: true

services:
  - type: keyvalue
    name: printloop-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: printloop-api
    runtime: node
    plan: free
    rootDir: printloop-api
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - fromGroup: printloop-shared
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: SEED_DEMO
        value: "0"
      - key: EMBED_WORKERS
        value: "1"
      - key: DB_SSL
        value: "true"
      - key: PRINT_DISPATCH_MODE
        value: kiosk-pull
      - key: COMMISSION_PCT_DEFAULT
        value: "0.10"
      - key: DATABASE_URL
        fromDatabase:
          name: printloop-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: printloop-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        value: https://printloop-api.onrender.com
      - key: PRINTLOOP_APEX_DOMAINS
        value: printloop.app
      - key: PRINTLOOP_DOMAINS_CNAME
        sync: false
      - key: LANDING_URL
        value: https://printloop-landing.onrender.com
      - key: CUSTOMER_APP_URL
        value: https://printloop-customer.onrender.com
      - key: SHOP_APP_URL
        value: https://printloop-shop.onrender.com
      - key: BACKOFFICE_URL
        value: https://printloop-backoffice.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://printloop-landing.onrender.com,https://printloop-customer.onrender.com,https://printloop-shop.onrender.com,https://printloop-backoffice.onrender.com
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: TERMII_API_KEY
        sync: false
      - key: TERMII_SENDER_ID
        sync: false
      - key: GOTENBERG_URL
        sync: false
      - key: UNIVER_EXPORT_URL
        sync: false

  - type: web
    name: printloop-landing
    runtime: node
    plan: free
    rootDir: printloop-web
    buildCommand: npm install -g pnpm@11.20.0 && pnpm install --frozen-lockfile && pnpm turbo run build --filter=@printloop/landing
    startCommand: cd apps/landing && ./node_modules/.bin/next start --port $PORT
    envVars:
      - fromGroup: printloop-shared
      - key: NODE_VERSION
        value: "22"
      - key: PL_API_URL
        value: https://printloop-api.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: https://printloop-api.onrender.com
      - key: PL_APEX_DOMAINS
        value: printloop.app
      - key: NEXT_PUBLIC_LANDING_URL
        value: https://printloop-landing.onrender.com
      - key: NEXT_PUBLIC_CUSTOMER_URL
        value: https://printloop-customer.onrender.com
      - key: NEXT_PUBLIC_SHOP_URL
        value: https://printloop-shop.onrender.com
      - key: NEXT_PUBLIC_BACKOFFICE_URL
        value: https://printloop-backoffice.onrender.com

  - type: web
    name: printloop-customer
    runtime: node
    plan: free

databases:
  - name: printloop-db
    plan: free
    databaseName: printloop
    user: printloop

services:
  - type: keyvalue
    name: printloop-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: printloop-api
    runtime: node
    plan: free
    rootDir: printloop-api
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: SEED_DEMO
        value: "0"
      - key: EMBED_WORKERS
        value: "1"
      - key: DB_SSL
        value: "true"
      - key: PRINT_DISPATCH_MODE
        value: kiosk-pull
      - key: COMMISSION_PCT_DEFAULT
        value: "0.10"
      - key: DATABASE_URL
        fromDatabase:
          name: printloop-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: printloop-redis
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: PL_EDGE_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: PRINTLOOP_APEX_DOMAINS
        sync: false
      - key: PRINTLOOP_DOMAINS_CNAME
        sync: false
      - key: LANDING_URL
        sync: false
      - key: CUSTOMER_APP_URL
        sync: false
      - key: SHOP_APP_URL
        sync: false
      - key: BACKOFFICE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: TERMII_API_KEY
        sync: false
      - key: TERMII_SENDER_ID
        sync: false
      - key: GOTENBERG_URL
        sync: false
      - key: UNIVER_EXPORT_URL
        sync: false

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '22'

jobs:
  api:
    name: API (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./printloop-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: printloop-api/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: OpenAPI spec is committed and current
        run: |
          npm run openapi:export
          git diff --exit-code openapi.json

  web:
    name: Web (lint, typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./printloop-web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: printloop-web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: printloop-web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generated API client matches the spec
        run: pnpm --filter @printloop/api-client check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: printloop-web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install API dependencies
        run: npm ci
        working-directory: ./printloop-api
      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./printloop-web
      - name: Build the apps
        run: pnpm build
        working-directory: ./printloop-web
      - name: Install browser
        run: pnpm --filter @printloop/e2e exec playwright install --with-deps chromium
        working-directory: ./printloop-web
      - name: Run end-to-end tests
        run: pnpm e2e
        working-directory: ./printloop-web
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: printloop-web/e2e/test-results
          retention-days: 7

  render-worker:
    name: Render Worker (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./render-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: render-worker/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  kiosk-app:
    name: Kiosk App (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./printloop-kiosk-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: printloop-kiosk-app/package-lock.json
      - run: npm ci
      - name: Typecheck (main process)
        run: npx tsc -p tsconfig.main.json --noEmit
      - name: Build
        run: npm run build

  deploy-api:
    name: Deploy API to Render
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [api, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render API deploy
        env:
          HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "RENDER_API_DEPLOY_HOOK is not set; skipping"; exit 0; fi
          curl -fsS -X POST "$HOOK"
          echo "API deploy triggered"
